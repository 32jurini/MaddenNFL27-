
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GRIDIRON 27 - Stadium Edition</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#18232c;color:white;font-family:Arial,sans-serif}
canvas{display:block}
button,select{font:inherit}
button{background:#263848;color:white;border:1px solid #657789;border-radius:8px;padding:11px;cursor:pointer;font-weight:bold}
button:hover{background:#43576c}
button.gold{background:#e8bb65;color:#18222c;border:0}
#score{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:3;background:#111b27ee;border-radius:0 0 12px 12px;padding:10px 20px;display:flex;justify-content:space-between;gap:40px;align-items:center;min-width:min(550px,96vw)}
#score b{font-size:25px}
#score small{display:block;color:#e6be72}
#down{text-align:center;font-size:13px;color:#f0cb84}
#toast{position:absolute;top:22%;width:100%;text-align:center;font-size:clamp(22px,5vw,42px);font-weight:900;text-shadow:0 4px 15px black;pointer-events:none;z-index:3}
#overlay{position:absolute;inset:0;background:#06111cd9;z-index:10;display:flex;justify-content:center;align-items:center;padding:15px}
#panel{width:min(760px,97vw);max-height:90vh;overflow:auto;background:#172635;border:1px solid #728395;border-radius:16px;padding:24px;box-shadow:0 20px 80px #000b}
h1{color:#eac16f;margin:0;font-size:38px}
h2{margin:6px 0}
p{color:#bdcbd7;line-height:1.5}
label{display:block;margin:14px 0 6px;font-size:12px;color:#c4d2dd;font-weight:bold}
select{background:#283a4c;color:white;border:1px solid #718294;padding:11px;width:100%;border-radius:8px}
#teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#plays{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.play{text-align:left;min-height:92px}
.play.active{background:#665432;border-color:#f1cb80}
.play strong{display:block}
.play small{display:block;color:#c7d3df;margin-top:7px;line-height:1.4}
#coach{padding:13px;background:#24384b;border-left:4px solid #eac16f;margin:15px 0;line-height:1.5;font-size:14px}
#panelFoot{display:flex;gap:10px;justify-content:flex-end}
#topButtons{position:absolute;top:80px;right:12px;display:flex;gap:7px;z-index:4}
#controls{position:absolute;bottom:12px;left:12px;background:#101d2cdd;padding:12px;border-radius:9px;font-size:12px;line-height:1.7;z-index:4}
#actions{position:absolute;bottom:12px;right:12px;display:flex;gap:7px;z-index:4}
#actions button{min-width:72px;background:#152a42e8}
#actions b{display:block;font-size:23px;color:#efc777}
#mobile{display:none;position:absolute;bottom:110px;left:12px;z-index:4}
#mobile button{touch-action:none;padding:13px;background:#30475ddd}
#mobile div{text-align:center}
@media(max-width:650px){
#plays,#teams{grid-template-columns:1fr}
#panel{padding:15px}
#score{gap:10px;padding:8px}
#controls{display:none}
#mobile{display:block}
#actions{right:5px;bottom:5px;gap:3px}
#actions button{min-width:52px;padding:8px}
#topButtons{top:66px;right:5px}
}
</style>
</head>
<body>

<div id="score">
 <div><small id="homeName">BUF</small><b id="homePoints">0</b></div>
 <div id="down">1ST & 10<br>OWN 25</div>
 <div style="text-align:right"><small id="awayName">KC</small><b id="awayPoints">0</b></div>
</div>

<div id="toast"></div>

<div id="topButtons">
 <button id="call">COACH / PLAYBOOK</button>
 <button id="music">♫ MUSIC OFF</button>
</div>

<div id="controls">
 <b>GRIDIRON CONTROLS</b><br>
 ARROW KEYS — Move / scramble<br>
 ENTER / SPACE — Snap ball<br>
 W — Throw to receiver W<br>
 E — Throw to receiver E<br>
 F — Throw to receiver F<br>
 P — Open playbook
</div>

<div id="mobile">
 <div><button data-move="arrowup">▲</button></div>
 <div>
 <button data-move="arrowleft">◀</button>
 <button data-move="arrowdown">▼</button>
 <button data-move="arrowright">▶</button>
 </div>
</div>

<div id="actions">
 <button id="snap">SNAP</button>
 <button data-pass="0"><b>W</b>PASS</button>
 <button data-pass="1"><b>E</b>PASS</button>
 <button data-pass="2"><b>F</b>PASS</button>
</div>

<div id="overlay">
 <div id="panel">
  <h1>🏈 GRIDIRON 27</h1>
  <h2>STADIUM EDITION</h2>
  <p id="subtitle">Choose your team and call your first play.</p>

  <div id="teams">
   <div>
    <label>YOUR TEAM</label>
    <select id="homeSelect"></select>
   </div>
   <div>
    <label>OPPONENT</label>
    <select id="awaySelect"></select>
   </div>
  </div>

  <label>COACH'S OFFENSIVE PLAYBOOK</label>
  <div id="plays"></div>

  <div id="coach"></div>

  <div id="panelFoot">
   <button id="newGame">NEW GAME</button>
   <button class="gold" id="go">TAKE THE FIELD</button>
  </div>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";

const $=id=>document.getElementById(id);

const TEAMS=[
 ["Buffalo Bills","BUF",0x245190,0xd33c45,0xe1e5e8],
 ["Denver Broncos","DEN",0xba592e,0x253c59,0x253c59],
 ["New England Patriots","NE",0x253b57,0xb74a4e,0x9ca9b4],
 ["Cleveland Browns","CLE",0x65452f,0xc97c42,0xc97c42],
 ["Las Vegas Raiders","LV",0x313b45,0xb3b6ba,0xb3b6ba],
 ["Philadelphia Eagles","PHI",0x235b57,0xa4b2b6,0x235b57],
 ["Los Angeles Rams","LAR",0x305d9a,0xe1bb60,0x305d9a],
 ["Kansas City Chiefs","KC",0xb43b43,0xe4bd65,0xb43b43],
 ["San Francisco 49ers","SF",0x9d4346,0xc5a875,0xc5a875],
 ["New York Jets","NYJ",0x31584d,0xe2e7df,0x31584d]
];

const PLAYS=[
 {
  name:"FOUR VERTICALS",
  desc:"Three deep routes. Attack the secondary.",
  routes:[
   [[-19,-20],[-19,-42]],
   [[0,-22],[0,-44]],
   [[19,-20],[19,-42]]
  ]
 },
 {
  name:"QUICK SLANTS",
  desc:"Fast inside routes for quick passes.",
  routes:[
   [[-18,-5],[-5,-18]],
   [[0,-8],[-8,-19]],
   [[18,-5],[5,-18]]
  ]
 },
 {
  name:"CROSSING ROUTES",
  desc:"Cross the field to beat man coverage.",
  routes:[
   [[-18,-9],[15,-19]],
   [[0,-15],[-15,-26]],
   [[18,-7],[-12,-15]]
  ]
 },
 {
  name:"CURL & OUT",
  desc:"Receivers turn back toward the quarterback.",
  routes:[
   [[-18,-15],[-18,-10]],
   [[0,-20],[0,-13]],
   [[18,-13],[23,-13]]
  ]
 },
 {
  name:"POST ATTACK",
  desc:"Deep routes break toward the goalposts.",
  routes:[
   [[-19,-13],[-5,-35]],
   [[0,-16],[0,-39]],
   [[19,-13],[5,-35]]
  ]
 },
 {
  name:"SIDELINE OUTS",
  desc:"Short routes toward the sidelines.",
  routes:[
   [[-17,-10],[-24,-10]],
   [[0,-18],[0,-23]],
   [[17,-10],[24,-10]]
  ]
 }
];

let home=0,away=7,play=0;
let homePoints=0,awayPoints=0;
let spot=25,firstDown=15,down=1;
let started=false,mode="menu";
let elapsed=0,deadTime=0,noticeTime=0;
let qb,carrier,receivers=[],defenders=[],players=[];
let airborne=false,flight=0,throwStart,throwTarget;
let routes=[];
const held={};

// THREE.JS WORLD
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8799a6);
scene.fog=new THREE.Fog(0x8799a6,130,260);

const camera=new THREE.PerspectiveCamera(
 58,innerWidth/innerHeight,.1,400
);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe2e8ee,0x68745c,1.6));

const sun=new THREE.DirectionalLight(0xffefdf,1.7);
sun.position.set(-35,75,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-85;
sun.shadow.camera.right=85;
sun.shadow.camera.top=85;
sun.shadow.camera.bottom=-85;
scene.add(sun);

function mat(color){
 return new THREE.MeshStandardMaterial({
  color,roughness:.85
 });
}

const turf=mat(0x456b50);
const white=mat(0xe2e5df);
const gold=mat(0xe4bd68);
const brown=mat(0x754830);
const dark=mat(0x26323e);

function box(w,h,d,m,x,y,z,parent=scene){
 const mesh=new THREE.Mesh(
  new THREE.BoxGeometry(w,h,d),m
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 parent.add(mesh);
 return mesh;
}

function sphere(r,m,x,y,z,parent){
 const mesh=new THREE.Mesh(
  new THREE.SphereGeometry(r,14,10),m
 );
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 parent.add(mesh);
 return mesh;
}

// REAL FIELD NUMBERS PAINTED ON TURF
function yardNumber(number,x,z){
 const canvas=document.createElement("canvas");
 canvas.width=256;
 canvas.height=256;
 const ctx=canvas.getContext("2d");

 ctx.fillStyle="#e9ebe5";
 ctx.font="900 160px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(String(number),128,135);

 const texture=new THREE.CanvasTexture(canvas);
 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(5.6,5.6),
  new THREE.MeshBasicMaterial({
   map:texture,
   transparent:true,
   depthWrite:false,
   side:THREE.DoubleSide
  })
 );
 mesh.rotation.x=-Math.PI/2;
 mesh.position.set(x,-.32,z);
 scene.add(mesh);
}

// STADIUM
box(170,1,240,mat(0x394451),0,-1.3,0);
box(54,.2,120,turf,0,-.55,0);
box(54,.24,10,mat(0x344e73),0,-.41,-55);
box(54,.24,10,mat(0x664e4d),0,-.41,55);

for(let z=-50;z<=50;z+=5){
 box(53,.025,z%10===0?.16:.07,white,0,-.41,z);
}

for(const x of [-26.6,26.6]){
 box(.15,.025,100,white,x,-.40,0);
}

for(let z=-40;z<=40;z+=10){
 const n=50-Math.abs(z);
 yardNumber(n,-19.5,z);
 yardNumber(n,19.5,z);
}

for(const x of [-8,8]){
 for(let z=-49;z<=49;z+=2){
  box(.32,.025,.55,white,x,-.39,z);
 }
}

for(const z of [-58,58]){
 box(.23,9,.23,gold,0,4.3,z);
 box(11,.23,.23,gold,0,8.8,z);

 for(const x of [-5.5,5.5]){
  box(.23,5,.23,gold,x,11.3,z);
 }
}

for(const side of [-1,1]){
 for(let level=0;level<12;level++){
  const color=level%2?0x5d6875:0x455466;
  box(
   7,1.15,154,mat(color),
   side*(32+level*2.8),
   level*1.8,0
  );
 }
}

for(const z of [-82,82]){
 box(135,18,4,mat(0x3c4958),0,12,z);
}

for(const x of [-54,54]){
 for(const z of [-68,68]){
  box(.5,31,.5,mat(0x8c979e),x,15,z);
  const light=box(
   10,2,1,mat(0xdce1df),x,31,z
  );
  light.material.emissive.setHex(0x666666);
 }
}

const scrimmage=box(53,.05,.18,mat(0x6b9dd7),0,-.34,spot);
const firstLine=box(53,.05,.18,gold,0,-.33,firstDown);

// LABELS AND UNIFORM NUMBERS
function canvasLabel(value,color="#fff",width=3){
 const canvas=document.createElement("canvas");
 canvas.width=256;
 canvas.height=128;
 const ctx=canvas.getContext("2d");

 ctx.fillStyle="#17212bcc";
 ctx.fillRect(12,10,232,108);
 ctx.font="bold 83px Arial";
 ctx.fillStyle=color;
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText(String(value),128,65);

 const texture=new THREE.CanvasTexture(canvas);
 const label=new THREE.Sprite(
  new THREE.SpriteMaterial({
   map:texture,
   depthTest:false,
   transparent:true
  })
 );
 label.scale.set(width,width/2,1);
 return label;
}

function numberOnJersey(number,parent,back=false){
 const canvas=document.createElement("canvas");
 canvas.width=128;
 canvas.height=128;
 const ctx=canvas.getContext("2d");

 ctx.font="900 86px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.lineWidth=5;
 ctx.strokeStyle="#1c2630";
 ctx.strokeText(number,64,66);
 ctx.fillStyle="#fff";
 ctx.fillText(number,64,66);

 const mesh=new THREE.Mesh(
  new THREE.PlaneGeometry(.8,.8),
  new THREE.MeshBasicMaterial({
   map:new THREE.CanvasTexture(canvas),
   transparent:true,
   side:THREE.DoubleSide
  })
 );

 mesh.position.set(0,2.3,back?.51:-.51);
 if(back)mesh.rotation.y=Math.PI;
 parent.add(mesh);
}

function player(team,number,key=null){
 const g=new THREE.Group();
 const jersey=mat(team[2]);
 const stripe=mat(team[3]);
 const helmet=mat(team[4]);
 const pants=mat(0xd7d9da);

 scene.add(g);
 players.push(g);

 box(1.2,1.35,.9,jersey,0,2.25,0,g);
 box(1.65,.35,1.05,jersey,0,2.87,0,g);
 box(.95,.7,.8,pants,0,1.28,0,g);

 for(const s of [-1,1]){
  box(.4,1.08,.43,pants,s*.29,.53,0,g);
  box(.43,.17,.68,dark,s*.29,.1,-.14,g);
  box(.36,.95,.41,jersey,s*.9,2.15,0,g);
  box(.37,.14,.43,stripe,s*.9,1.76,0,g);
 }

 sphere(.49,helmet,0,3.39,0,g);
 box(.76,.13,.2,mat(0xc8ced2),0,3.17,-.47,g);
 box(.58,.13,.14,dark,0,3.4,-.49,g);

 numberOnJersey(String(number),g);
 numberOnJersey(String(number),g,true);

 if(key){
  const label=canvasLabel(key,"#fff",2.7);
  label.position.y=5.2;
  g.add(label);
 }

 return g;
}

const ball=new THREE.Mesh(
 new THREE.SphereGeometry(.36,14,10),brown
);
ball.scale.set(.8,.72,1.3);
ball.castShadow=true;
scene.add(ball);

function roster(){
 players.forEach(p=>scene.remove(p));
 players=[];
 receivers=[];
 defenders=[];

 qb=player(TEAMS[home],7);
 receivers=[
  player(TEAMS[home],11,"W"),
  player(TEAMS[home],13,"E"),
  player(TEAMS[home],88,"F")
 ];

 defenders=[21,24,29,31,43,54,58].map(
  n=>player(TEAMS[away],n)
 );

 carrier=qb;
}

function clearRoutes(){
 routes.forEach(r=>scene.remove(r));
 routes=[];
}

function drawRoutes(){
 clearRoutes();
 const origins=[-19,0,19];

 PLAYS[play].routes.forEach((route,i)=>{
  const points=[[origins[i],0],...route].map(
   p=>new THREE.Vector3(p[0],-.27,spot+p[1])
  );

  const line=new THREE.Line(
   new THREE.BufferGeometry().setFromPoints(points),
   new THREE.LineBasicMaterial({
    color:0xf2d087,
    depthTest:false
   })
  );

  scene.add(line);
  routes.push(line);
 });
}

function routeGoal(i,time){
 const origins=[-19,0,19];
 const nodes=[
  [origins[i],0],
  ...PLAYS[play].routes[i]
 ];

 let remaining=time*8.5;

 for(let k=1;k<nodes.length;k++){
  const a=nodes[k-1],b=nodes[k];
  const length=Math.hypot(b[0]-a[0],b[1]-a[1]);

  if(remaining<=length){
   const t=length?remaining/length:0;
   return {
    x:a[0]+(b[0]-a[0])*t,
    z:spot+a[1]+(b[1]-a[1])*t
   };
  }
  remaining-=length;
 }

 const last=nodes[nodes.length-1];
 return {x:last[0],z:spot+last[1]};
}

function moveToward(p,point,speed,dt){
 const dx=point.x-p.position.x;
 const dz=point.z-p.position.z;
 const distance=Math.hypot(dx,dz);
 if(distance<.03)return;

 const step=Math.min(distance,speed*dt);
 p.position.x+=dx/distance*step;
 p.position.z+=dz/distance*step;
 p.rotation.y=Math.atan2(-dx,-dz);
}

function notice(text,seconds=1.3){
 $("toast").textContent=text;
 noticeTime=seconds;
}

function hud(){
 const need=Math.max(1,Math.ceil(spot-firstDown));
 const field=spot>=0
  ?"OWN "+Math.round(50-spot)
  :"OPP "+Math.round(50+spot);

 $("homeName").textContent=TEAMS[home][1];
 $("awayName").textContent=TEAMS[away][1];
 $("homePoints").textContent=homePoints;
 $("awayPoints").textContent=awayPoints;

 $("down").innerHTML=
  `${["1ST","2ND","3RD","4TH"][down-1]} & ${need}<br>${field}`;
}

function setupPlay(){
 mode="ready";
 elapsed=0;
 airborne=false;
 carrier=qb;

 qb.position.set(0,0,spot+3.5);
 qb.rotation.y=0;

 receivers.forEach((r,i)=>{
  r.position.set([-19,0,19][i],0,spot+1);
  r.rotation.y=0;
 });

 defenders.forEach((d,i)=>{
  d.position.set(
   [-21,-14,-7,0,7,14,21][i],
   0,
   spot-8-(i%3)*2
  );
  d.rotation.y=Math.PI;
 });

 ball.visible=true;
 ball.position.set(0,2.3,spot+2.8);
 scrimmage.position.z=spot;
 firstLine.position.z=Math.max(-50,firstDown);

 drawRoutes();
 hud();
 notice("PLAY SELECTED — SNAP THE BALL",1.8);
}

function snap(){
 if(mode!=="ready")return;
 mode="live";
 elapsed=0;
 clearRoutes();
 notice("HIKE!",.6);
}

function pass(index){
 if(mode!=="live"||carrier!==qb||airborne||elapsed<.15)return;

 airborne=true;
 flight=0;
 throwStart=ball.position.clone();
 throwTarget=receivers[index];

 notice("PASS TO "+["W","E","F"][index],.7);
}

function finish(kind,at){
 if(mode!=="live")return;

 mode="dead";
 airborne=false;
 deadTime=1.6;
 notice(kind,2);

 if(kind==="TOUCHDOWN!"){
  homePoints+=7;
  spot=25;
  down=1;
  firstDown=15;
 }else if(kind==="INTERCEPTED!"){
  spot=25;
  down=1;
  firstDown=15;
 }else{
  if(Number.isFinite(at)){
   spot=THREE.MathUtils.clamp(at,-49.5,49);
  }

  if(spot<=firstDown){
   down=1;
   firstDown=spot-10;
   if(kind==="TACKLED!")notice("FIRST DOWN!",1.7);
  }else{
   down++;
   if(down>4){
    notice("TURNOVER ON DOWNS",2);
    down=1;
    spot=25;
    firstDown=15;
   }
  }
 }

 hud();
}

function coachAdvice(){
 const need=Math.max(1,Math.ceil(spot-firstDown));
 const recommendation=need<=5
  ?"QUICK SLANTS"
  :need>=13
   ?"FOUR VERTICALS"
   :"CROSSING ROUTES";

 $("coach").innerHTML=
  "<b>🎧 COACH:</b> "+
  (started
   ?`It's ${["first","second","third","fourth"][down-1]} down and ${need} to go. I'd recommend <b>${recommendation}</b>, but it's your call.`
   :"Choose the offense you want to run.")+
  `<p style="margin-bottom:0;color:#e8c177">SELECTED: ${PLAYS[play].name}</p>`;
}

function choosePlay(index){
 play=index;
 document.querySelectorAll(".play").forEach(
  (b,i)=>b.classList.toggle("active",i===index)
 );
 coachAdvice();
 if(mode==="ready")drawRoutes();
}

function showCoach(){
 if(mode==="live"||mode==="dead")return;

 mode="menu";
 $("overlay").style.display="flex";
 $("teams").style.display=started?"none":"grid";
 $("go").textContent=started?"RUN THIS PLAY":"TAKE THE FIELD";
 $("subtitle").textContent=started
  ?"Your coach is calling the next play. Choose your route combination."
  :"Choose your teams and call your first play.";

 coachAdvice();
}

function startGame(){
 const selectedHome=Number($("homeSelect").value);
 const selectedAway=Number($("awaySelect").value);

 if(!started){
  if(selectedHome===selectedAway){
   alert("Choose two different teams!");
   return;
  }
  home=selectedHome;
  away=selectedAway;
  homePoints=0;
  awayPoints=0;
  spot=25;
  firstDown=15;
  down=1;
  started=true;
  roster();
 }

 $("overlay").style.display="none";
 setupPlay();
 startMusic();
}

// TEAM SELECTION
TEAMS.forEach((team,i)=>{
 for(const id of ["homeSelect","awaySelect"]){
  const option=document.createElement("option");
  option.value=i;
  option.textContent=team[0];
  $(id).appendChild(option);
 }
});

$("homeSelect").value=0;
$("awaySelect").value=7;

// PLAY SELECTION
PLAYS.forEach((p,i)=>{
 const button=document.createElement("button");
 button.className="play";
 const title=document.createElement("strong");
 title.textContent=p.name;
 const desc=document.createElement("small");
 desc.textContent=p.desc;
 button.append(title,desc);
 button.onclick=()=>choosePlay(i);
 $("plays").appendChild(button);
});
choosePlay(0);

$("go").onclick=startGame;
$("call").onclick=showCoach;
$("snap").onclick=snap;

$("newGame").onclick=()=>{
 started=false;
 mode="menu";
 players.forEach(p=>scene.remove(p));
 players=[];
 clearRoutes();
 $("teams").style.display="grid";
 $("subtitle").textContent="Choose a new matchup.";
 $("go").textContent="TAKE THE FIELD";
 coachAdvice();
};

document.querySelectorAll("[data-pass]").forEach(
 button=>button.onclick=()=>pass(Number(button.dataset.pass))
);

// KEYBOARD
document.addEventListener("keydown",e=>{
 const k=e.key.toLowerCase();

 if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(k)){
  e.preventDefault();
 }

 held[k]=true;
 if(e.repeat)return;

 if(k==="enter"||k===" ")snap();
 if(k==="w")pass(0);
 if(k==="e")pass(1);
 if(k==="f")pass(2);
 if(k==="p")showCoach();
});

document.addEventListener("keyup",e=>{
 held[e.key.toLowerCase()]=false;
});

window.addEventListener("blur",()=>{
 Object.keys(held).forEach(k=>held[k]=false);
});

document.querySelectorAll("[data-move]").forEach(button=>{
 button.addEventListener("pointerdown",e=>{
  e.preventDefault();
  held[button.dataset.move]=true;
  button.setPointerCapture(e.pointerId);
 });

 for(const type of ["pointerup","pointercancel","lostpointercapture"]){
  button.addEventListener(type,()=>{
   held[button.dataset.move]=false;
  });
 }
});

// ORIGINAL PROCEDURAL STADIUM MUSIC
let audio=null;
let musicOn=false;
let musicTimer=null;
let beatStep=0;

function note(frequency,duration,volume,type="sine"){
 if(!audio)return;
 const oscillator=audio.createOscillator();
 const gain=audio.createGain();
 const t=audio.currentTime;

 oscillator.type=type;
 oscillator.frequency.value=frequency;
 gain.gain.setValueAtTime(volume,t);
 gain.gain.exponentialRampToValueAtTime(.0001,t+duration);

 oscillator.connect(gain);
 gain.connect(audio.destination);

 oscillator.start(t);
 oscillator.stop(t+duration+.01);
}

function beat(){
 if(!musicOn||!audio)return;

 const step=beatStep++%16;

 if(step%4===0)note(82.4,.25,.04,"triangle");
 if(step===0||step===8)note(55,.13,.1);
 if(step===4||step===12)note(165,.06,.025,"square");
 if(step%2===0)note(660,.025,.007,"triangle");
 if(step===7||step===15)note(330,.15,.012,"sawtooth");
}

function startMusic(){
 if(!musicOn)return;

 if(!audio){
  audio=new (window.AudioContext||window.webkitAudioContext)();
 }
 audio.resume();

 if(!musicTimer){
  beat();
  musicTimer=setInterval(beat,190);
 }
}

$("music").onclick=()=>{
 musicOn=!musicOn;
 $("music").textContent=musicOn?"♫ MUSIC ON":"♫ MUSIC OFF";

 if(musicOn){
  startMusic();
 }else{
  clearInterval(musicTimer);
  musicTimer=null;
 }
};

// GAME LOOP
function update(dt){
 if(noticeTime>0){
  noticeTime-=dt;
  if(noticeTime<=0)$("toast").textContent="";
 }

 if(mode==="dead"){
  deadTime-=dt;
  if(deadTime<=0){
   setupPlay();
   showCoach();
  }
 }

 if(!started||!qb)return;

 if(mode==="live"){
  elapsed+=dt;

  const dx=Number(!!held.arrowright)-Number(!!held.arrowleft);
  const dz=Number(!!held.arrowdown)-Number(!!held.arrowup);
  const mag=Math.hypot(dx,dz);

  if(mag&&!airborne){
   const speed=carrier===qb?7.6:10.2;
   carrier.position.x+=dx/mag*speed*dt;
   carrier.position.z+=dz/mag*speed*dt;
   carrier.rotation.y=Math.atan2(-dx,-dz);
  }

  carrier.position.x=THREE.MathUtils.clamp(carrier.position.x,-25.3,25.3);
  carrier.position.z=THREE.MathUtils.clamp(carrier.position.z,-50,49);

  receivers.forEach((r,i)=>{
   if(r===carrier)return;
   moveToward(r,routeGoal(i,elapsed),9.3,dt);
  });

  if(airborne){
   flight+=dt/.67;
   const t=Math.min(1,flight);
   const destination=throwTarget.position.clone();
   destination.y=2.3;

   ball.position.lerpVectors(throwStart,destination,t);
   ball.position.y+=Math.sin(t*Math.PI)*4.1;
   ball.rotation.x+=dt*12;

   if(t>=1){
    airborne=false;

    const coverage=Math.min(...defenders.map(
     d=>d.position.distanceTo(throwTarget.position)
    ));

    if(coverage<1.05){
     finish("INTERCEPTED!");
    }else if(coverage<2.25){
     finish("PASS INCOMPLETE");
    }else{
     carrier=throwTarget;
     notice("CAUGHT! RUN!",1.1);
    }
   }
  }else{
   ball.position.set(
    carrier.position.x,
    2.18,
    carrier.position.z-.53
   );
  }

  defenders.forEach((d,i)=>{
   let target=airborne?throwTarget:carrier;

   if(!airborne&&carrier===qb&&elapsed<1.2&&i<3){
    target=receivers[i];
   }

   moveToward(d,target.position,5.6+(i%3)*.5,dt);
  });

  if(!airborne){
   if(carrier.position.z<=-49.5){
    finish("TOUCHDOWN!");
   }else if(defenders.some(
    d=>d.position.distanceTo(carrier.position)<1.45
   )){
    finish("TACKLED!",carrier.position.z);
   }else if(elapsed>25){
    finish("PLAY OVER",carrier.position.z);
   }
  }
 }

 const focus=carrier||qb;
 const desired=new THREE.Vector3(
  focus.position.x*.45+6,
  17,
  focus.position.z+23
 );

 camera.position.lerp(desired,Math.min(1,dt*3.8));
 camera.lookAt(
  focus.position.x,
  1.5,
  focus.position.z-10
 );
}

let last=performance.now();

function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min(.05,(now-last)/1000);
 last=now;
 update(dt);
 renderer.render(scene,camera);
}

camera.position.set(8,19,47);
camera.lookAt(0,1,10);
requestAnimationFrame(animate);

window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
